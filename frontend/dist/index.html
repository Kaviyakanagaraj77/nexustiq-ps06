<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ledgerwatch — Transaction Risk Desk</title>
<style>
  :root{
    --ink: #131b26;
    --panel: #1b2536;
    --panel-raised: #212d42;
    --paper: #eee9de;
    --paper-line: #d8d1bf;
    --text-hi: #f2efe6;
    --text-mid: #b8c0cf;
    --text-dim: #7c8798;
    --amber: #d9a441;
    --red: #c1443c;
    --green: #4c9a6a;
    --rule: #33415a;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ink);
    color: var(--text-hi);
    font-family: var(--mono);
    min-height: 100vh;
  }
  a { color: inherit; }

  .app {
    display: grid;
    grid-template-columns: 300px 1fr;
    min-height: 100vh;
  }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { border-right: none; border-bottom: 1px solid var(--rule); }
  }

  .sidebar {
    border-right: 1px solid var(--rule);
    padding: 28px 20px;
    background: var(--panel);
  }
  .brand {
    font-family: var(--serif);
    font-size: 22px;
    color: var(--text-hi);
    letter-spacing: 0.01em;
    margin: 0 0 2px 0;
  }
  .brand-sub {
    color: var(--text-dim);
    font-size: 12px;
    margin-bottom: 28px;
  }
  .section-label {
    color: var(--text-dim);
    font-size: 11px;
    letter-spacing: 0.06em;
    margin: 22px 0 10px 0;
  }
  .customer-list { list-style: none; margin: 0; padding: 0; }
  .customer-item {
    padding: 12px 10px;
    border: 1px solid transparent;
    border-radius: 3px;
    cursor: pointer;
    margin-bottom: 4px;
    transition: background 120ms ease, border-color 120ms ease;
  }
  .customer-item:hover { background: var(--panel-raised); }
  .customer-item.active {
    background: var(--panel-raised);
    border-color: var(--rule);
  }
  .customer-item .cid { color: var(--text-dim); font-size: 11px; }
  .customer-item .cname { color: var(--text-hi); font-size: 14px; margin-top: 2px; }
  .customer-item .cmeta { color: var(--text-dim); font-size: 11px; margin-top: 4px; }
  .status-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    margin-right: 6px; vertical-align: middle;
  }

  .main { padding: 34px 44px; max-width: 980px; }
  .empty-state {
    color: var(--text-dim);
    font-family: var(--serif);
    font-size: 18px;
    margin-top: 120px;
    text-align: center;
  }

  .case-header { border-bottom: 1px solid var(--rule); padding-bottom: 20px; margin-bottom: 24px; }
  .case-id { color: var(--text-dim); font-size: 12px; }
  .case-title { font-family: var(--serif); font-size: 30px; margin: 6px 0 8px 0; color: var(--text-hi); }
  .case-meta { color: var(--text-mid); font-size: 13px; display: flex; gap: 18px; flex-wrap: wrap; }

  .run-btn {
    margin-top: 18px;
    background: var(--amber);
    color: #1a1408;
    border: none;
    font-family: var(--mono);
    font-weight: 600;
    font-size: 13px;
    padding: 11px 20px;
    border-radius: 3px;
    cursor: pointer;
    letter-spacing: 0.02em;
  }
  .run-btn:disabled { opacity: 0.55; cursor: default; }
  .run-btn:hover:not(:disabled) { filter: brightness(1.08); }

  .verdict-banner {
    margin-top: 26px;
    padding: 18px 20px;
    border-radius: 4px;
    border-left: 4px solid var(--green);
    background: rgba(76, 154, 106, 0.10);
  }
  .verdict-banner.attention {
    border-left-color: var(--red);
    background: rgba(193, 68, 60, 0.10);
  }
  .verdict-label { font-size: 11px; letter-spacing: 0.06em; color: var(--text-dim); margin-bottom: 6px; }
  .verdict-text { font-family: var(--serif); font-size: 17px; color: var(--text-hi); line-height: 1.5; }
  .narrative-source { font-size: 10.5px; color: var(--text-dim); margin-top: 10px; }

  .priority-block { margin-top: 22px; }
  .priority-block h3 { font-family: var(--serif); font-weight: 600; font-size: 15px; color: var(--text-hi); margin-bottom: 6px; }
  .priority-block ol { margin: 8px 0 4px 20px; padding: 0; color: var(--text-mid); font-size: 13px; line-height: 1.7; }
  .priority-reason { color: var(--text-dim); font-size: 12px; margin-top: 6px; font-style: normal; }

  .findings { margin-top: 30px; }
  .findings h3 { font-family: var(--serif); font-size: 17px; color: var(--text-hi); margin-bottom: 14px; }
  .finding-card {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  .finding-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .finding-rule { font-family: var(--serif); font-size: 16px; color: var(--text-hi); }
  .sev-tag {
    font-size: 10.5px; letter-spacing: 0.05em; padding: 3px 8px; border-radius: 2px;
    text-transform: uppercase;
  }
  .sev-high { background: rgba(193,68,60,0.18); color: #e79289; }
  .sev-medium { background: rgba(217,164,65,0.18); color: #e8bd75; }
  .sev-low { background: rgba(124,135,152,0.2); color: var(--text-mid); }
  .finding-narrative { color: var(--text-mid); font-size: 13.5px; line-height: 1.65; margin: 10px 0 14px 0; }

  .ledger-strip { border-top: 1px dashed var(--rule); padding-top: 12px; }
  .ledger-strip-label { color: var(--text-dim); font-size: 10.5px; margin-bottom: 8px; }
  .ledger-row {
    display: grid; grid-template-columns: 96px 90px 1fr 110px 90px;
    gap: 10px; font-size: 12px; padding: 5px 0; color: var(--text-mid);
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }
  .ledger-row.header { color: var(--text-dim); font-size: 10.5px; border-bottom: 1px solid var(--rule); }
  .ledger-amt { text-align: right; color: var(--text-hi); }

  .full-ledger { margin-top: 34px; }
  .full-ledger summary {
    cursor: pointer; color: var(--text-dim); font-size: 12px; padding: 10px 0;
    border-top: 1px solid var(--rule);
  }
  .full-ledger[open] summary { color: var(--text-mid); }

  .loading-line { color: var(--text-dim); font-size: 13px; margin-top: 20px; }
  .error-box {
    margin-top: 20px; padding: 14px 18px; border: 1px solid var(--red);
    border-radius: 4px; color: #e79289; font-size: 13px; background: rgba(193,68,60,0.08);
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <p class="brand">Ledgerwatch</p>
    <p class="brand-sub">Transaction Risk Investigation Desk</p>
    <p class="section-label">CUSTOMER HISTORIES</p>
    <ul class="customer-list" id="customerList"></ul>
  </aside>
  <main class="main" id="main">
    <div class="empty-state">Select a customer history from the left<br/>to open the case.</div>
  </main>
</div>

<script>
const state = { customers: [], activeId: null, transactions: null, report: null };

async function fetchJSON(url, opts) {
  const res = await fetch(url, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

async function loadCustomers() {
  try {
    state.customers = await fetchJSON('/api/customers');
    renderSidebar();
  } catch (e) {
    document.getElementById('customerList').innerHTML =
      `<li class="error-box">Could not load customers: ${escapeHtml(e.message)}</li>`;
  }
}

function renderSidebar() {
  const list = document.getElementById('customerList');
  list.innerHTML = state.customers.map(c => `
    <li class="customer-item ${c.customer_id === state.activeId ? 'active' : ''}" data-id="${c.customer_id}">
      <div class="cid">${c.customer_id}</div>
      <div class="cname">${escapeHtml(c.name)}</div>
      <div class="cmeta">${c.transaction_count} txns · ${c.period_start} → ${c.period_end}</div>
    </li>
  `).join('');
  list.querySelectorAll('.customer-item').forEach(el => {
    el.addEventListener('click', () => selectCustomer(el.dataset.id));
  });
}

async function selectCustomer(id) {
  state.activeId = id;
  state.report = null;
  renderSidebar();
  const main = document.getElementById('main');
  main.innerHTML = `<div class="loading-line">Loading transaction history…</div>`;
  try {
    const data = await fetchJSON(`/api/customers/${id}/transactions`);
    state.transactions = data;
    renderCase();
  } catch (e) {
    main.innerHTML = `<div class="error-box">${escapeHtml(e.message)}</div>`;
  }
}

function renderCase() {
  const t = state.transactions;
  const main = document.getElementById('main');
  const dates = t.transactions.map(x => x.date);
  const start = dates.length ? dates.reduce((a,b) => a < b ? a : b) : '—';
  const end = dates.length ? dates.reduce((a,b) => a > b ? a : b) : '—';

  main.innerHTML = `
    <div class="case-header">
      <div class="case-id">CASE FILE · ${t.customer_id}</div>
      <div class="case-title">${escapeHtml(t.name)}</div>
      <div class="case-meta">
        <span>Account opened ${t.account_opened}</span>
        <span>${t.transactions.length} transactions reviewed</span>
        <span>${start} — ${end}</span>
      </div>
      <button class="run-btn" id="runBtn">Run investigation</button>
    </div>
    <div id="reportArea"></div>
    <details class="full-ledger">
      <summary>View full transaction ledger (${t.transactions.length} rows)</summary>
      ${renderLedgerTable(t.transactions)}
    </details>
  `;
  document.getElementById('runBtn').addEventListener('click', runInvestigation);
}

function renderLedgerTable(txns) {
  const rows = txns.map(tx => `
    <div class="ledger-row">
      <span>${tx.date}</span>
      <span>${tx.time}</span>
      <span>${escapeHtml(tx.description)} — ${escapeHtml(tx.payee)}</span>
      <span>${escapeHtml(tx.channel)}</span>
      <span class="ledger-amt">${tx.type === 'debit' ? '−' : '+'}₹${tx.amount.toLocaleString('en-IN')}</span>
    </div>
  `).join('');
  return `
    <div class="ledger-row header">
      <span>Date</span><span>Time</span><span>Description / Payee</span><span>Channel</span><span style="text-align:right">Amount</span>
    </div>
    ${rows}
  `;
}

async function runInvestigation() {
  const btn = document.getElementById('runBtn');
  btn.disabled = true;
  btn.textContent = 'Investigating…';
  const area = document.getElementById('reportArea');
  area.innerHTML = `<div class="loading-line">Checking history against the risk rule set…</div>`;
  try {
    const report = await fetchJSON(`/api/investigate/${state.activeId}`, { method: 'POST' });
    state.report = report;
    renderReport(report);
  } catch (e) {
    area.innerHTML = `<div class="error-box">Investigation failed: ${escapeHtml(e.message)}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Re-run investigation';
  }
}

function renderReport(r) {
  const area = document.getElementById('reportArea');
  const attention = r.needs_attention;

  let priorityHtml = '';
  if (r.priority_order && r.priority_order.length) {
    const byId = Object.fromEntries(r.findings.map(f => [f.rule_id, f]));
    priorityHtml = `
      <div class="priority-block">
        <h3>What to look at first</h3>
        <ol>
          ${r.priority_order.map(rid => byId[rid] ? `<li>${escapeHtml(byId[rid].rule_name)}</li>` : '').join('')}
        </ol>
        ${r.priority_reasoning ? `<div class="priority-reason">${escapeHtml(r.priority_reasoning)}</div>` : ''}
      </div>
    `;
  }

  const findingsHtml = r.findings.map(f => `
    <div class="finding-card">
      <div class="finding-top">
        <div class="finding-rule">${escapeHtml(f.rule_name)}</div>
        <span class="sev-tag sev-${f.severity}">${f.severity}</span>
      </div>
      <div class="finding-narrative">${escapeHtml(f.narrative)}</div>
      <div class="ledger-strip">
        <div class="ledger-strip-label">CITED TRANSACTIONS (${f.transactions.length})</div>
        ${renderLedgerTable(f.transactions)}
      </div>
    </div>
  `).join('');

  area.innerHTML = `
    <div class="verdict-banner ${attention ? 'attention' : ''}">
      <div class="verdict-label">${attention ? 'NEEDS ATTENTION' : 'NOTHING FLAGGED'}</div>
      <div class="verdict-text">${escapeHtml(r.overall_summary)}</div>
      <div class="narrative-source">narrative source: ${escapeHtml(r.narrative_source)}</div>
    </div>
    ${priorityHtml}
    ${r.findings.length ? `<div class="findings"><h3>Findings (${r.findings.length})</h3>${findingsHtml}</div>` : ''}
  `;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

loadCustomers();
</script>
</body>
</html>
